<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#262626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Document</title>
    <link rel="manifest" href="manifest.json">
<style>
  .background-dark {
    background-color: #000000;
  }
  .center {
    display: flex; 
    justify-content: center;
  }
  .margin-top {
    margin-top: 40px;
  }
  .timer {
    font-size: 60px; 
    color: white; 
    font-family: 'Roboto', sans-serif; 
  }

</style>
 
<script>
function startMenu() {
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

let alarm;
let timerStarted = false;
let intervalID = null;
let a = 7;

document.addEventListener("DOMContentLoaded", function () {
    let eisize = "07 : 00";
    document.getElementById("timer").textContent = eisize;
});

function startS() {
    document.getElementById("timer").innerHTML = "06 : 00";
    a = 6;
}

function startM() {
    document.getElementById("timer").innerHTML = "06 : 30";
    a = 6.5;
}

function startL() {
    document.getElementById("timer").innerHTML = "07 : 00";
    a = 7;
}

function startTimer() {

    if (timerStarted) {
        return;
    }

    // Audio nach Benutzeraktion initialisieren
    alarm = new Audio("alarm.wav");
    alarm.preload = "auto";

    // Audio für spätere Wiedergabe "freischalten"
    alarm.play()
        .then(() => {
            alarm.pause();
            alarm.currentTime = 0;
        })
        .catch(() => {});

    let startTime = Date.now();
    let eizeit = a * 60 * 1000;
    let endTime = startTime + eizeit;

    intervalID = setInterval(function () {

        let timeLeft = endTime - Date.now();

        if (timeLeft > 0) {

            let minutes = Math.floor(timeLeft / 60000);
            let seconds = Math.floor((timeLeft % 60000) / 1000);

            let text =
                String(minutes).padStart(2, "0") +
                " : " +
                String(seconds).padStart(2, "0");

            document.getElementById("timer").innerHTML = text;

        } else {

            clearInterval(intervalID);
            intervalID = null;

            document.getElementById("timer").innerHTML = "00 : 00";

            alarm.play().catch(function (err) {
                console.log("Audiofehler:", err);
                alert("Timer abgelaufen!");
            });

            timerStarted = false;
        }

    }, 1000);

    timerStarted = true;
}
</script>

</head>
<body class="background-dark">

<!-- Popup-Fenster -->
<div id="popup" style="display: none; position: fixed; top: 30%; left: 40%; transform: translate(-50%, -30%);
     background-color: rgb(158, 150, 224); padding: 20px; border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 1000; width: 60%;">
  <p>1. Ei an der stumpfen Seite anpieken<br>
     2. Wasser zum Kochen bringen<br>
     3. Im Ei-Timer die Eigröße anklicken<br>
     4. Ei in das Wasser legen und Ei-Timer starten<br>
     5. Nach ca. 1 Minute Herd ausschalten (Restwärme)<br>
     6. Nach Ablauf der Zeit Ei mit kaltem Wasser abschrecken<br>
     7. "Guten Appetit"
  </p>
  <button onclick="closePopup()">Schließen</button>
</div>

  <div>
    <img onclick="startMenu()" src="img/menu.png">
  </div>

<div style="display: flex; gap: 10px;">
  <img onclick="startS()" src="img/EisizeS.png">
  <img onclick="startM()" src="img/EisizeM.png">
  <img onclick="startL()" src="img/EisizeL.png">
</div>


  <div class="center margin-top">
    <img src="img/Ei.png">
  </div>

  <div class="center margin-top timer" id="timer">
  <!-- Inhalt wird per JavaScript gesetzt -->
  </div>

  <div class="center margin-top">
    <img onclick="startTimer()" src="img/start.png">
  </div>
</body>
</html>
