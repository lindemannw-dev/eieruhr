<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#262626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Eieruhr No.3</title>

<link rel="manifest" href="manifest.json">

<style>

.background-dark{
    background-color:#000000;
}

.center{
    display:flex;
    justify-content:center;
}

.margin-top{
    margin-top:40px;
}

.timer{
    font-size:60px;
    color:white;
    font-family:Arial,sans-serif;
}

.stop-button{
    display:none;
    font-size:24px;
    padding:12px 24px;
    background:#ff3333;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>

<script>

function startMenu() {
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

let alarm;
let timerStarted = false;
let intervalID = null;
let audioUnlocked = false;
let a = 7;

document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("timer").textContent = "07 : 00";
});

function startS() {
    document.getElementById("timer").innerHTML = "06 : 00";
    a = 6;
}

function startM() {
    document.getElementById("timer").innerHTML = "06 : 30";
    a = 6.5;
}

function startL() {
    document.getElementById("timer").innerHTML = "07 : 00";
    a = 7;
}

function stopAlarm() {

    if (alarm) {
        alarm.pause();
        alarm.currentTime = 0;
        alarm.loop = false;
    }

    document.getElementById("stopButton").style.display = "none";
}

function startTimer() {

    if (timerStarted) {
        return;
    }

    if (!audioUnlocked) {

        let unlock = new Audio("silent.mp3");

        unlock.play()
            .then(() => {
                unlock.pause();
                unlock.currentTime = 0;
                audioUnlocked = true;
            })
            .catch(() => {});
    }

    alarm = new Audio("alarm.mp3");

    let startTime = Date.now();
    let eizeit = a * 60 * 1000;
    let endTime = startTime + eizeit;

    intervalID = setInterval(function () {

        let timeLeft = endTime - Date.now();

        if (timeLeft > 0) {

            let minutes = Math.floor(timeLeft / 60000);
            let seconds = Math.floor((timeLeft % 60000) / 1000);

            document.getElementById("timer").innerHTML =
                String(minutes).padStart(2,"0") +
                " : " +
                String(seconds).padStart(2,"0");

        } else {

            clearInterval(intervalID);

            document.getElementById("timer").innerHTML = "00 : 00";

            alarm.loop = true;
            alarm.currentTime = 0;

            alarm.play().catch(function() {
                alert("⏰ Eier fertig!");
            });

            document.getElementById("stopButton").style.display = "block";

            timerStarted = false;
        }

    }, 1000);

    timerStarted = true;
}

</script>

</head>

<body class="background-dark">

<div id="popup"
     style="display:none;
            position:fixed;
            top:30%;
            left:40%;
            transform:translate(-50%,-30%);
            background-color:rgb(158,150,224);
            padding:20px;
            border:2px solid #333;
            box-shadow:0 0 10px rgba(0,0,0,0.5);
            z-index:1000;
            width:60%;">

<p>
1. Ei an der stumpfen Seite anpieken<br>
2. Wasser zum Kochen bringen<br>
3. Im Ei-Timer die Eigröße anklicken<br>
4. Ei in das Wasser legen und Ei-Timer starten<br>
5. Nach ca. 1 Minute Herd ausschalten (Restwärme)<br>
6. Nach Ablauf der Zeit Ei mit kaltem Wasser abschrecken<br>
7. Guten Appetit
</p>

<button onclick="closePopup()">Schließen</button>

</div>

<div>
    <img onclick="startMenu()" src="img/menu.png">
</div>

<div style="display:flex; gap:10px;">
    <img onclick="startS()" src="img/EisizeS.png">
    <img onclick="startM()" src="img/EisizeM.png">
    <img onclick="startL()" src="img/EisizeL.png">
</div>

<div class="center margin-top">
    <img src="img/Ei.png">
</div>

<div class="center margin-top timer" id="timer">
</div>

<div class="center margin-top">
    <img onclick="startTimer()" src="img/start.png">
</div>

<div class="center margin-top">
    <button id="stopButton"
            class="stop-button"
            onclick="stopAlarm()">
        Alarm beenden
    </button>
</div>

</body>
</html>
